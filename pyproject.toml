[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawan-job-agent"
version = "1.0.0"
description = "Evidence-based job discovery and approval-controlled application tracking"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "hypothesis==6.170.8", "ruff==0.17.2", "mypy==2.4.0", "build==1.6.1", "setuptools>=68", "wheel"]

[project.scripts]
job-agent = "job_agent.cli:main"

[tool.setuptools.packages.find]
include = ["job_agent*"]

[tool.setuptools.package-data]
job_agent = ["sql/*.sql", "py.typed", "templates/*.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.coverage.run]
source = ["job_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

